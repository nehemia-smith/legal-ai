<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Daftar — Legatia</title>
  <style>
    :root{--bg:#0d1018;--card:#151923;--line:#252c3c;--gold:#d2ad4c;--muted:#9aa3b5;--error:#f17474}*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:radial-gradient(circle at 50% 0,#182542 0,transparent 45%),var(--bg);color:#eeeae0;font-family:Arial,sans-serif}.card{width:min(440px,100%);padding:38px 34px;background:rgba(21,25,35,.97);border:1px solid var(--line);border-radius:22px;text-align:center;box-shadow:0 24px 80px #0005}.logo{color:var(--gold);font:600 42px Georgia,serif}.sub{margin-top:4px;color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase}.card h1{margin:34px 0 8px;font:600 34px Georgia,serif}.desc{margin:0 0 24px;color:var(--muted);line-height:1.5}.google,.submit{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}.google{background:#fff;color:#202124}.submit{background:var(--gold);color:#151923;margin-top:14px}.google svg{width:20px;margin-right:10px}.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}label{display:block;text-align:left;color:#dfe3eb;font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid var(--line);background:#0e121b;color:#fff;font-size:14px}input:focus{outline:2px solid #d2ad4c55;border-color:var(--gold)}.alert{display:none;margin:0 0 16px;padding:11px;border:1px solid #8f3c4b;border-radius:9px;background:#391d28;color:var(--error);font-size:13px;line-height:1.45}.alert.show{display:block}.switch{margin-top:22px;color:var(--muted);font-size:13px}.switch a,.back{color:var(--gold);text-decoration:none}.back{display:block;margin-top:24px;color:#69748a;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">⚖ Legatia</div><div class="sub">Asisten hukum Indonesia</div>
    <h1>Buat akun Legatia</h1><p class="desc">Mulai memahami hukum Indonesia dengan lebih jernih.</p>
    <div class="alert" id="alert"></div>
    <a class="google" href="/auth/google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 2.56 34.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Daftar dengan Google</a>
    <div class="divider">atau daftar dengan email</div>
    <form id="register-form">
      <label for="name">Nama</label><input id="name" type="text" autocomplete="name" required placeholder="Nama lengkap">
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="nama@contoh.com">
      <label for="password">Password</label><input id="password" type="password" autocomplete="new-password" required placeholder="Minimal 6 karakter">
      <button class="submit" type="submit">Buat akun</button>
    </form>
    <div class="switch">Sudah punya akun? <a href="/login">Masuk dengan email</a></div>
    <a class="back" href="/">← Kembali ke beranda</a>
  </main>
  <script>
    const form=document.getElementById('register-form'), alertEl=document.getElementById('alert');
    function showError(message){alertEl.textContent=message;alertEl.classList.add('show')}
    form.addEventListener('submit',async e=>{e.preventDefault();alertEl.classList.remove('show');const button=form.querySelector('button');button.disabled=true;button.textContent='Menyimpan…';try{const res=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Pendaftaran belum dapat diselesaikan.');location.href=data.redirect||'/chat'}catch(err){showError(err.message)}finally{button.disabled=false;button.textContent='Buat akun'}})
  </script>
</body>
</html>
