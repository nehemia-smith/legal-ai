<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Masuk — Legatia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#0d1018;--card:#151923;--line:#252c3c;--gold:#d2ad4c;--muted:#7b8498;--error:#f17474}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#182542 0,transparent 45%),var(--bg);color:#eeeae0;font-family:'DM Sans',sans-serif}.card{width:min(440px,100%);padding:42px 36px;background:rgba(21,25,35,.96);border:1px solid var(--line);border-radius:22px;text-align:center;box-shadow:0 24px 80px #0005}.logo{color:var(--gold);font:600 42px 'Cormorant Garamond',serif}.sub{margin-top:4px;color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase}.card h1{margin-top:42px;font:600 34px 'Cormorant Garamond',serif}.desc{margin:8px 0 28px;color:var(--muted);line-height:1.5}.google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px;border:0;border-radius:10px;background:#fff;color:#202124;font-size:15px;font-weight:600;text-decoration:none}.google:hover{background:#f2f2f2}.google svg{width:20px}.alert{display:none;margin:0 0 18px;padding:12px;border:1px solid #8f3c4b;border-radius:9px;background:#391d28;color:var(--error);font-size:13px;line-height:1.45}.alert.show{display:block}.switch{margin-top:24px;color:var(--muted);font-size:13px}.switch a{color:var(--gold);text-decoration:none}.back{display:block;margin-top:30px;color:#69748a;font-size:12px;text-decoration:none}</style></head><body><main class="card"><div class="logo">⚖ Legatia</div><div class="sub">Asisten hukum Indonesia</div><h1>Selamat datang</h1><p class="desc">Masuk dengan akun Google Anda untuk melanjutkan ke asisten hukum Legatia.</p><div class="alert" id="alert"></div><a class="google" href="/auth/google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Lanjutkan dengan Google</a><div class="switch">Belum punya akun? <a href="/register">Daftar dengan Google</a></div><a class="back" href="/">← Kembali ke beranda</a></main><script>const map={google_denied:'Login Google dibatalkan.',token_failed:'Login sedang mengalami gangguan. Silakan coba lagi.',userinfo_failed:'Profil Google tidak dapat dibaca. Silakan coba lagi.',no_email:'Akun Google tidak memiliki email yang dapat digunakan.',database_unavailable:'Login sedang mengalami gangguan. Silakan coba lagi beberapa saat.'};const e=new URLSearchParams(location.search).get('error');if(e){const a=document.getElementById('alert');a.textContent=map[e]||'Login belum dapat diselesaikan. Silakan coba lagi.';a.classList.add('show')}</script></body></html>
